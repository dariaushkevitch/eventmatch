<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="ss.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="bodyy">
    <div class="logo">
        <span class="t-logo"> EventMatch </span>
    </div>
<form action="registration.php" method="POST" name="user_reg_form">
    <div class="container-regi">
        <div class="perexod">
            <a href="html-vxod.html" class="inactive"> Вход </a>
            <a href="html-regi.html" class="active">Регистрация </a>
        </div>
        <p>
            <label class="toppi">Электронная почта(логин)</label><br>
            <input type="email" class="email-regi" name="email" id="email" placeholder="Email" required maxlength="256" minlength="7">
        </p>
        <p>
            <label class="toppi">Никнейм (будет виден всем):</label><br>
            <input type="text" class="nick-regi" name="nickname" id="nick" placeholder="Петька 228"  maxlength="20" minlength="2" required>
        </p>
        <p>
            <label class="toppi">Пароль:</label><br>
            <input type="password" class="password-regi" name="password" id="pass" placeholder="Придумайте пароль" required maxlength="50" minlength="6">
        </p>
        <p>
            <div class="pol">
            Ваш пол:<br>
            <input type="radio" name="gender" id="m" value="male" checked> 
            <label for="m">Мужской</label>
            <input type="radio" name="gender" id="w" value="female"  > 
            <label for="w">Женский</label>
        </p>
        <p>
            <input type="checkbox" name="agree" id="rules" value="yes" required>
            <label for="rules">Я принимаю условия соглашения</label>
            </div>
        </p>

        <p>
            <button  type ="submit"class="button-regi">
                Зарегистрироваться
            </button>
        </p>
    </div>
</form>
</body>
</html>
